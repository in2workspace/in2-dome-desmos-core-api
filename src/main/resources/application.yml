# Spring Configuration
spring:
  application:
    name: "desmos-blockchain-connector"
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:100MB}
  r2dbc:
    url: "r2dbc:postgresql://localhost:5433/it_db"
    username: "postgres"
    password: "postgres"
    generate-unique-name: true
  flyway:
    url: "jdbc:postgresql://localhost:5433/it_db"
    locations: classpath:db/migration

# Spring Logging Configuration
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    es.in2.desmos: INFO

# Spring Management Configuration - Actuator
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health, info, loggers, metrics, prometheus
      base-path: /
      path-mapping:
        health: health
        info: info
        loggers: loggers
        metrics: metrics
        prometheus: prometheus
  endpoint:
    health:
      enabled: true
      show-details: always
    loggers:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# SpringDoc Configuration - OpenAPI 3.0 Documentation & Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Server Configuration
server:
  port: 8080

# Application Configuration
openapi:
  server:
    url: "https://localhost:8081"
    description: "Server Description"
  info:
    title: "Blockchain Connector"
    version: "2.0.0-SNAPSHOT"
    description: "Blockchain Connector Component"
    termsOfService: "https://example.com/terms-of-service"
    license:
      name: "Apache 2.0"
      url: "https://www.apache.org/licenses/LICENSE-2.0.html"
    contact:
      email: "test@example.com"
      name: "Test Name"
      url: "https://example.com"

# Operator Configuration
operator:
  organizationIdentifier: "VATES-S9999999E"

# Desmos Configuration
api:
  externalDomain: "http://localhost:8080"
  version: v2
  # Max bytes the shared WebClient buffers in memory per response (and per streamed JSON object).
  # Default WebClient limit is 256KB, too small for large NGSI-LD entities exchanged during P2P sync.
  max-in-memory-size: ${API_MAX_IN_MEMORY_SIZE:100MB}
  # Outgoing HTTP timeouts. The response timeout is the max time without receiving data (not the total
  # duration), so long P2P NDJSON streams are not cut while data keeps flowing. The genesis node can take
  # ~90s to start answering a discovery, hence the generous default.
  connect-timeout: ${API_CONNECT_TIMEOUT:10s}
  response-timeout: ${API_RESPONSE_TIMEOUT:300s}

# Context Broker Configuration
broker:
  provider: "scorpio"
  internalDomain: "http://scorpio:9090"
  paths:
    entities: "/ngsi-ld/v1/entities"
    entityOperations: "/ngsi-ld/v1/entityOperations"
    subscriptions: "/ngsi-ld/v1/subscriptions"
    temporal: "/ngsi-ld/v1/temporal/entities"
  # Entities requested per page when paginating queries by type during P2P sync. Must not exceed the
  # broker's own max query limit (Scorpio's scorpio.entity.max-limit, 1000 by default) — going over it
  # returns 403, not a truncated page.
  pageSize: 1000
  # Max time without receiving data from the broker before a request to it fails. Generous because the P2P
  # sync writes many entities concurrently and a loaded broker can take long to answer some of them.
  response-timeout: ${BROKER_RESPONSE_TIMEOUT:120s}

# NGSI Subscription Configuration
ngsi-subscription:
  notificationEndpoint: "http://desmos:8080/api/${api.version}/notifications/broker"

# DLT Adapter Configuration
dlt-adapter:
  provider: "digitelts"
  internalDomain: "http://dlt-adapter:8080"
  externalDomain: "http://localhost:8080"
  paths:
    publication: "/api/v1/publishEvent"
    subscription: "/api/v1/subscribe"
    events: "/api/v1/events"
  # Max time without receiving data from the DLT adapter (subscriptions, events).
  response-timeout: ${DLT_ADAPTER_RESPONSE_TIMEOUT:120s}
  # Max time waiting for the answer to a publication; the adapter answers once the transaction is confirmed.
  # A publication cut by it is not retried and its outcome is unknown, so it is long.
  publication-timeout: ${DLT_ADAPTER_PUBLICATION_TIMEOUT:10m}

# Event Subscription Configuration
tx-subscription:
  notificationEndpoint: "http://desmos:8080/api/${api.version}/notifications/dlt"

security:
  privateKey: "0xd1d346bbb4e3748b370c5985face9a4e5b402dcf41d3f715a455d08144b2327f"
  learCredentialMachineInBase64:

# Access Node
access-node:
  trustedAccessNodesList: "https://raw.githubusercontent.com/DOME-Marketplace/trust-framework/refs/heads/main/sbx/trusted_access_nodes_list.yaml"

external-access-nodes:
  urls: ""

verifier:
  url: "https://verifier.dome-marketplace-sbx.org/verifier"

# Desmos log output
desmos:
  logging:
    # Max size of a payload written to the log (only at DEBUG); longer payloads are truncated.
    payload-max-size: ${DESMOS_LOGGING_PAYLOAD_MAX_SIZE:2KB}
    # Requests to a genesis node slower than this are logged with a WARN.
    slow-request-threshold: ${DESMOS_LOGGING_SLOW_REQUEST_THRESHOLD:30s}

