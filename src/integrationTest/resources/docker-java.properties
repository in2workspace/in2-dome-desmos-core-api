# Docker Engine 29+ hard-rejects any client that doesn't negotiate an API
# version >= its MinAPIVersion. Testcontainers 1.20.x's shaded docker-java
# client falls back to a hardcoded 1.32 instead of negotiating, so every
# GenericContainer.start() fails with "client version 1.32 is too old" on
# a modern daemon. Documented workaround:
# https://github.com/testcontainers/testcontainers-java/issues/11210
api.version=1.44
