plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    // https://plugins.gradle.org/plugin/org.sonarqube
    id 'org.sonarqube' version '7.2.3.7755'
    // https://docs.gradle.org/current/userguide/checkstyle_plugin.html
    id 'checkstyle'
    // https://plugins.gradle.org/plugin/org.owasp.dependencycheck
    id 'org.owasp.dependencycheck' version '10.0.4'
    id 'com.github.ben-manes.versions' version "0.51.0"
    id 'se.patrikerdes.use-latest-versions' version '0.2.18'
}

group = 'es.in2'
version = '2.0.20'

java {
    sourceCompatibility = '17'
}

sourceSets {
    integrationTest {
        // Gradle's default convention already maps this source set to
        // src/integrationTest/java and src/integrationTest/resources.
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // The integration-test source set shares the lightweight unit-test toolbox
    // (Mockito, AssertJ, reactor-test, ...) but keeps the Testcontainers stack
    // out of `test`, so `./gradlew test` never boots Docker.
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestCompileOnly.extendsFrom testCompileOnly
    integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

configurations.configureEach {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group.startsWith('com.fasterxml.jackson')) {
                details.useVersion '2.17.0'
            }
            // The Spring Cloud BOM (imported below) ships its own, older
            // org.testcontainers version and silently wins over the versions
            // declared in `dependencies {}`, downgrading every testcontainers
            // artifact here to 1.19.8 regardless of what is requested. That
            // old client fails to negotiate with newer Docker Engines ("client
            // version 1.32 is too old"). Force the version we actually declare.
            if (details.requested.group == 'org.testcontainers') {
                details.useVersion '1.20.6'
            }
        }
    }
}

checkstyle {
    toolVersion = '10.16.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

checkstyleMain {
    source = 'src/main/java'
}

checkstyleTest {
    source = 'src/test/java'
}

checkstyleIntegrationTest {
    source = 'src/integrationTest/java'
}

sonar {
    properties {
        property "sonar.projectName", "IN2 Desmos API"
        property "sonar.projectKey", "in2workspace_in2-desmos-api"
        property "sonar.organization", "in2workspace"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.exclusions",
                "src/main/java/es/in2/desmos/DesmosApiApplication.java, " +
                        "src/main/java/es/in2/desmos/infrastructure/configs/properties/**, " +
                        "src/main/java/es/in2/desmos/infrastructure/configs/FlywayConfig.java, " +
                        "src/main/java/es/in2/desmos/infrastructure/configs/QueueConfig.java"
        property "sonar.tests", "src/test/java,src/integrationTest/java"
        property "sonar.junit.reportPaths", "build/test-results/test,build/test-results/integrationTest"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.0")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // https://mvnrepository.com/artifact/com.nimbusds/nimbus-jose-jwt
    implementation 'com.nimbusds:nimbus-jose-jwt:9.41.2'
    // https://mvnrepository.com/artifact/org.bouncycastle/bcpkix-jdk18on
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    // Data
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql:10.20.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    runtimeOnly 'org.postgresql:r2dbc-postgresql:1.0.7.RELEASE'
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    // Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.6.0'
    // Logback
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    // Metrics & Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.13.6'
    // Resilience
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects:6.1.14'
    implementation 'org.aspectj:aspectjrt:1.9.22.1'
    implementation 'org.aspectj:aspectjweaver:1.9.22.1'
    // Unit Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test:3.6.11'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // EqualsVerifier
    testImplementation 'nl.jqno.equalsverifier:equalsverifier:3.17.1'
    // Integration Test (Testcontainers, two-node replication behaviour tests)
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:junit-jupiter:1.20.6'
    integrationTestImplementation 'org.testcontainers:r2dbc:1.20.6'
    integrationTestImplementation 'org.testcontainers:postgresql:1.20.6'
}

tasks.named('compileJava') {
    inputs.files(tasks.named('processResources'))
}

tasks.register('printVersion') {
    doLast {
        println version
    }
}

tasks.register('printProjectName') {
    doLast {
        println rootProject.name
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy(tasks.jacocoTestReport)
}

// ---------------------------------------------------------------------------
// Node B's image, for the two-node replication tests.
//   default                  -> build from this working tree (see below)
//   -Pdesmos.image=<ref>     -> use <ref> verbatim, skip the local build entirely
//   DESMOS_IMAGE=<ref> (env) -> same, for CI
// ---------------------------------------------------------------------------
def desmosImageOverride = providers.gradleProperty('desmos.image')
        .orElse(providers.environmentVariable('DESMOS_IMAGE'))
def localDesmosImageTag = "in2-desmos-api:it-${project.version}"

// Stage a minimal build context: the boot jar plus the slim runtime Dockerfile.
// No Gradle build happens inside Docker here -- bootJar already ran on the host,
// incrementally, with a warm Gradle cache -- so this is a single COPY layer.
tasks.register('stageDesmosTestImage', Copy) {
    from(tasks.named('bootJar').flatMap { it.archiveFile }) { rename { 'desmos-api.jar' } }
    from('src/integrationTest/docker/Dockerfile')
    into(layout.buildDirectory.dir('docker/desmos-it'))
}

tasks.register('buildDesmosTestImage', Exec) {
    group = 'docker'
    description = "Builds ${localDesmosImageTag} from the jar this working tree just produced."
    dependsOn tasks.named('stageDesmosTestImage')
    workingDir layout.buildDirectory.dir('docker/desmos-it')
    commandLine 'docker', 'build', '--tag', localDesmosImageTag, '.'
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Two-node replication behaviour tests and other Testcontainers-backed integration tests.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter(tasks.named('test'))
    finalizedBy(tasks.jacocoTestReport)

    // Containers live in static fields shared across a whole JVM (see ContainerManager);
    // running forks in parallel would multiply the container topology per fork.
    maxParallelForks = 1
    forkEvery = 0
    maxHeapSize = '2g'

    if (!desmosImageOverride.isPresent()) {
        dependsOn tasks.named('buildDesmosTestImage')
    }
    systemProperty 'desmos.image', desmosImageOverride.getOrElse(localDesmosImageTag)
    doFirst { logger.lifecycle("Node B image: {}", systemProperties['desmos.image']) }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.jacocoTestReport {
    dependsOn(tasks.test)
    // Picks up integrationTest.exec too, when that task has also run in this invocation,
    // so a single `sonar` analysis sees combined unit + integration coverage.
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec'))
    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.outputLocation.set(layout.buildDirectory.dir("jacocoHtml"))
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/DesmosApiApplication.class',
                    '**/infrastructure/configs/properties/**',
                    '**/infrastructure/configs/FlywayConfig.class',
                    '**/infrastructure/configs/QueueConfig.class'
            ])
        }))
    }
}

tasks.register('checkstyle') {
    reports {
        xml.required = false
        html.required = true
    }
}

// Dependency Maintenance
def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}
